<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Pendaftaran</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #f0e6ff 100%);
            color: #4a2e35;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
        }
        nav {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(219, 112, 147, 0.2);
            margin-bottom: 25px;
            text-align: center;
        }
        nav a {
            color: #8a2be2;
            text-decoration: none;
            font-weight: 600;
            padding: 6px 12px;
            transition: all 0.3s ease;
        }
        nav a:hover {
            color: #ff1493;
            background-color: #ffe6f2;
            border-radius: 8px;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(186, 85, 211, 0.15);
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #ffd1dc;
        }
        h2 {
            color: #c71585;
            text-align: center;
        }
        label {
            font-weight: 600;
            color: #8a2be2;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #d8bfd8;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #c71585;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Profil</a> | 
        <a href="about-me.html">Tentang Saya</a> | 
        <a href="educations.html">Pendidikan</a> | 
        <a href="course-schedule.html">Jadwal Kuliah</a> | 
        <a href="hobbies.html">Hobi</a> | 
        <a href="form.html">Formulir</a> | 
        <a href="table1.html">Tabel 1</a> | 
        <a href="table2.html">Tabel 2</a> | 
        <a href="table3.html">Tabel 3</a>
    </nav>

    <div class="container">
        <h2>Formulir Pendaftaran</h2>

        <form action="#" method="post">
            <label>Nama Lengkap:</label>
            <input type="text" name="nama" value="Alisa Nurillah Auliyasin">

            <label>Email:</label>
            <input type="email" name="email" placeholder="nama@email.com">

            <label>Password:</label>
            <input type="password" name="password">

            <label>Umur:</label>
            <input type="number" name="umur" value="19">

            <label>Tanggal Lahir:</label>
            <input type="date" name="tanggal_lahir" value="2007-10-28">

            <label>Jenis Kelamin:</label><br>
            <input type="radio" id="pria" name="jk" value="Laki-laki" style="width:auto;"> Laki-laki
            <input type="radio" id="wanita" name="jk" value="Perempuan" checked style="width:auto;"> Perempuan<br><br>

            <label>Jurusan:</label>
            <select name="jurusan">
                <option value="Sistem Informasi" selected>Sistem Informasi</option>
                <option value="Sastra Inggris">Sastra Inggris</option>
            </select>

            <label>Alamat:</label>
            <textarea name="alamat" rows="3"></textarea>

            <button type="submit">Kirim</button>
            <button type="reset" style="background-color:#9370db;">Reset</button>
        </form>
    </div>

</body>
</html>
